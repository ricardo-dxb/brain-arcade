:root{color-scheme:light dark;--bg:light-dark(#5ec8f2,#0d1b33);--bg2:light-dark(#8fdaf7,#132748);--card:light-dark(#ffffff,#1b2d4f);--ink:light-dark(#1b2340,#f3f6ff);--soft:light-dark(#5b6584,#a9b6d6);--line:light-dark(#1b2340,#06101f);--sun:#ffcf3f;--coral:#ff6b5a;--grass:#2fa84f;--ok:#22b35e;--bad:#ef5350;--me:#ff6b5a;--me2:light-dark(#ffe1dc,#4a2630)}

money:{name:'Shop Keeper',blurb:'Counting coins and giving change.',gen(L){if(L>=4&&Math.random()<.6){const pay=L===4?100:pick([200,500]),cost=L===4?ri(1,18)*5:ri(4,pay/5-2)*5,ch=pay-cost;return Q(`A toy costs ${fm(cost)}. You pay with ${fm(pay)}. How much change?`,fm(ch),nums(ch,[ch+10,ch-10,ch+5,ch-5,cost,ch+50]).filter(x=>x>0).map(fm),{explain:`${fm(pay)} − ${fm(cost)} = ${fm(ch)}. Count on from ${fm(cost)} up to ${fm(pay)}.`})}const C=[[1,2,5,10],[1,2,5,10,20],[2,5,10,20,50],[5,10,20,50,100],[10,20,50,100,200]][L-1],n=L<=1?ri(2,3):ri(3,4),cs=Array.from({length:n},()=>pick(C)).sort((a,b)=>b-a),t=cs.reduce((a,b)=>a+b,0);return Q('How much money is here?',fm(t),nums(t,[t+1,t-1,t+10,t-10,t+5,t-5,t+2]).filter(x=>x>0).map(fm),{visual:coinsSVG(cs),explain:`${cs.map(fm).join(' + ')} = ${fm(t)}`})}},
place:{name:'Place Value Palace',blurb:'Ones, tens, hundreds. What is each digit worth?',gen(L){if(L>=4&&Math.random()<.5){const n=ri(L===5?1000:120,L===5?9800:980),d=pick(L===5?[10,100,1000]:[10,100]),up=Math.random()<.5,ans=up?n+d:n-d,o=d===10?100:10;return Q(`What is ${d} ${up?'more':'less'} than ${n}?`,ans,nums(ans,[up?n-d:n+d,n+1,ans+1,ans+o,ans-o]),{explain:`Only the ${d===10?'tens':d===100?'hundreds':'thousands'} digit changes: ${n} → ${ans}`})}const dig=L<=1?2:L===5?4:3,n=ri(10**(dig-1),10**dig-1),s=String(n),i=ri(0,dig-1),dg=+s[i];if(!dg)return GAMES.place.gen(L);const val=dg*10**(dig-1-i);return Q(`What is the <b class="hl">highlighted</b> digit worth?<span class="bignum">${s.slice(0,i)}<b class="hl">${dg}</b>${s.slice(i+1)}</span>`,val,shuffle([dg,dg*10,dg*100,dg*1000].filter(x=>x!==val&&x<10**(dig+1))),{say:`What is the ${dg} worth in ${n}?`,explain:`The ${dg} is in the ${['ones','tens','hundreds','thousands'][dig-1-i]} column, so it's worth ${val}.`})}},
wsort:{name:'Word Detectives',blurb:'Nouns, verbs and adjectives. Crack the case!',gen(L){const C=L<3?['noun','verb','adjective']:['noun','verb','adjective','adverb'],B=WSORT.filter(x=>C.includes(x[1])),[s,c]=pick(B),w=s.match(/\*(.+?)\*/)[1];return Q(`What type of word is <b class="hl">${w}</b>?<span class="sent">${hl(s)}</span>`,c,C.filter(x=>x!==c),{n:C.length,say:`${s.replace(/\*/g,'')} What type of word is ${w}?`,explain:`"${w}" is ${c==='adjective'||c==='adverb'?'an':'a'} ${c}: ${DEF[c]}.`})}},

pct:{name:'Percent Market',blurb:'Percentages of amounts — be a savvy shopper.',gen(L){if(L===5&&Math.random()<.5){const p=pick([10,20,25,15,30]),base=pick([40,60,80,120,200,240]),dn=Math.random()<.5,ch=p*base/100,ans=dn?base-ch:base+ch;return Q(`A bike costs £${base}. The price goes ${dn?'down':'up'} by ${p}%. What is the new price?`,'£'+ans,nums(ans,[ch,dn?base+ch:base-ch,ans+10,ans-5]).map(x=>'£'+x),{explain:`${p}% of £${base} = £${ch}. Then £${base} ${dn?'−':'+'} £${ch} = £${ans}`})}const p=pick([[50,25,10],[50,25,10,75,20],[10,20,5,15,30,75],[5,15,35,45,60,12.5],[5,15,35,45,60,12.5,2.5]][L-1]),base=(L<=2?20:40)*ri(1,10),ans=r3(p*base/100),tip={50:'halve it',25:'halve it, then halve again',10:'divide by 10',75:'find 25%, then × 3',20:'find 10%, then double',5:'find 10%, then halve',15:'10% + 5%'}[p];return Q(`What is ${p}% of ${base}?`,ans,nums(ans,[r3(ans*10),base-ans,r3(ans/2),ans*2,r3(ans+base/10)]),{explain:`${tip?'Tip: '+tip+'. ':''}${p}% of ${base} = ${ans}`})}},

bodmas:{name:'Order Order!',blurb:'Brackets, powers, ×÷ then +−. Who goes first?',gen(L){const T=[()=>{const a=ri(2,9),b=ri(2,9),c=ri(2,9);return[`${a} + ${b} × ${c}`,a+b*c,(a+b)*c]},()=>{const b=ri(2,6),c=ri(2,5),a=b*c+ri(1,20);return[`${a} − ${b} × ${c}`,a-b*c,(a-b)*c]},()=>{const a=ri(2,9),b=ri(2,9),c=ri(2,6);return[`(${a} + ${b}) × ${c}`,(a+b)*c,a+b*c]},()=>{const c=ri(2,9),b=c*ri(2,9),a=ri(2,20);return[`${a} + ${b} ÷ ${c}`,a+b/c,r3((a+b)/c)]},()=>{const a=ri(2,9),c=ri(1,4),b=c+ri(2,8);return[`${a} × (${b} − ${c})`,a*(b-c),a*b-c]},()=>{const a=ri(2,9),b=ri(2,9),c=ri(2,5);return[`${a}² + ${b} × ${c}`,a*a+b*c,(a*a+b)*c]},()=>{const a=ri(2,9),b=ri(2,9),c=ri(2,6),d=ri(2,6);return[`${a} × ${b} − ${c} × ${d}`,a*b-c*d,(a*b-c)*d]}],[e,ans,w]=pick(T.slice(0,[2,3,5,6,7][L-1]))();if(ans<0)return GAMES.bodmas.gen(L);return Q(`${e} = ?`,ans,[w].concat(nums(ans,[ans+1,ans-1,ans+10])),{eq:1,explain:`Do × and ÷ (and brackets and powers) first: ${e} = ${ans}. Working left to right would give ${w}.`})}},
ratio:{name:'Recipe Ratios',blurb:'Scale recipes and share things fairly.',gen(L){const v=pick(L<=2?[0]:L===3?[0,1,2]:L===4?[1,2]:[1,2,3]);if(v===0){const n=pick([2,3,4]),f=pick([2,3]),m=n*f,base=ri(1,6)*50,food=pick(['flour','pasta','rice','sugar']),ans=base*f;return Q(`A recipe for ${n} people uses ${base} g of ${food}. How much for ${m} people?`,ans+' g',nums(ans,[base+(m-n),ans+50,base*(f+1),ans-50]).filter(x=>x>0).map(x=>x+' g'),{explain:`${m} people is ${f} times as many, so ${base} × ${f} = ${ans} g`})}if(v===1){const [n,m]=pick([[4,6],[2,5],[4,10],[6,9],[3,5]]),per=ri(2,10)*10,base=per*n,ans=per*m;return Q(`A recipe for ${n} people uses ${base} g of butter. How much for ${m} people?`,ans+' g',nums(ans,[base+(m-n)*10,ans+per,ans-per,base*2]).filter(x=>x>0).map(x=>x+' g'),{explain:`One person: ${base} ÷ ${n} = ${per} g. ${m} people: ${per} × ${m} = ${ans} g`})}if(v===2){const a=ri(1,4),b=ri(a+1,7),k=ri(2,12),N=(a+b)*k,ans=b*k;return Q(`Share £${N} in the ratio ${a} : ${b}. How much is the bigger share?`,'£'+ans,nums(ans,[a*k,N/2,k,ans+k,ans-k]).filter(x=>x>0&&x%1===0).map(x=>'£'+x),{explain:`${a} + ${b} = ${a+b} parts. £${N} ÷ ${a+b} = £${k} per part. Bigger share: ${b} × £${k} = £${ans}`})}const a=ri(2,5),b=ri(a+1,9),k=ri(3,9),ans=b*k;return Q(`For every ${a} red beads there are ${b} blue beads. There are ${a*k} red beads. How many blue?`,ans,nums(ans,[a*k+(b-a),ans+k,ans-k,a*k]),{explain:`${a*k} ÷ ${a} = ${k} groups. ${k} × ${b} = ${ans} blue beads`})}},
neg:{name:'Polar Expedition',blurb:'Negative numbers and freezing temperatures.',gen(L){const v=L<=2?0:pick([0,1,2]),c=x=>fn(x)+'°C';if(v===0){const t=ri(-8,6),d=ri(3,12),up=Math.random()<.5,ans=up?t+d:t-d;return Q(`It is ${c(t)}. The temperature ${up?'rises':'falls'} by ${d}°C. What is it now?`,c(ans),nums(ans,[up?t-d:t+d,-ans,ans+1,ans-1,ans+2],1).map(c),{explain:`Start at ${c(t)} and count ${up?'up':'down'} ${d}: ${c(ans)}`})}if(v===1){const a=-ri(2,15),b=ri(1,15),ans=b-a;return Q(`What is the difference between ${c(a)} and ${c(b)}?`,ans+'°C',nums(ans,[b+a,Math.abs(b+a),ans+1,ans-1]).filter(x=>x>0).map(x=>x+'°C'),{explain:`From ${c(a)} up to 0 is ${-a}, then up to ${b} is ${b} more: ${-a} + ${b} = ${ans}`})}const a=ri(-10,10),b=ri(1,15),add=a<0&&Math.random()<.5,ans=add?a+b:a-b;return Q(`${fn(a)} ${add?'+':'−'} ${b} = ?`,fn(ans),nums(ans,[-ans,add?a-b:a+b,ans+1,ans-1],1).map(fn),{eq:1,explain:`Start at ${fn(a)} on a number line and move ${b} ${add?'right':'left'}: ${fn(ans)}`})}},

function makeQs(){const g=GAMES[R.games[R.round]],out=[],seen=new Set(),RL=R.lv[R.round],RW=R.gw[R.round];OPTN=RW==='lily'&&GW(R.who)==='lily'&&R.diff!=='easy'?5:4;const pg=PERS[R.games[R.round]];for(let i=0;i<40&&out.length<PERQ;i++){let q=null;if(pg&&Math.random()<(RL<=5&&RW===GW(R.who)?.45:0)){try{q=pg(Math.min(RL,5),RW)}catch(e){q=null}}if(!q)q=(RL>5&&g.hard?g.hard(RL,RW):g.gen(g.sci?RL:Math.min(RL,5),RW));const k=q.prompt+q.answer;if(!seen.has(k)){seen.add(k);if(R.diff==='easy'&&q.options.length>3){const w=shuffle(q.options.filter(o=>o!==q.answer)).slice(0,2);q.options=shuffle([q.answer,...w])}out.push(q)}}let guard=0;while(out.length<PERQ&&guard++<20){const q=(RL>5&&g.hard?g.hard(RL,RW):g.gen(g.sci?RL:Math.min(RL,5),RW));if(R.diff==='easy'&&q.options.length>3){const w=shuffle(q.options.filter(x=>x!==q.answer)).slice(0,2);q.options=shuffle([q.answer,...w])}out.push(q)}return out}

let pinBuf='';
function pinPad(){pinBuf='';me=null;setMe(null);const o=document.createElement('div');o.className='overlay';o.id='ov';o.innerHTML=`<div class="chunk"><h2>Grown-ups only</h2><p class="muted" style="margin:0">Enter the 4-digit PIN</p><div class="pindots" id="pindots">${'<i></i>'.repeat(4)}</div><div class="pinpad">${[1,2,3,4,5,6,7,8,9,'x',0,'<'].map(k=>k==='x'?`<button data-act="quitNo" class="pk sm">Cancel</button>`:`<button class="pk" data-act="pin" data-v="${k}">${k==='<'?'⌫':k}</button>`).join('')}</div></div>`;document.body.appendChild(o)}
function pinKey(k){if(k==='<')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;const d=document.getElementById('pindots');if(d)d.innerHTML=[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('');if(pinBuf.length===4){if(pinBuf===S.settings.pin){closeOv();grown()}else{d.classList.add('no');setTimeout(()=>{pinBuf='';d.classList.remove('no');d.innerHTML='<i></i>'.repeat(4)},500)}}}
function grownKeep(){const y=window.scrollY;grown();window.scrollTo(0,y)}


/* export / import */
const enc=o=>'BA1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=s=>{s=String(s||'').trim().replace(/\s+/g,'');if(!s.startsWith('BA1:'))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(s.slice(4)))));if(!o||!o.players||!o.players.lily||!o.players.lucas)throw 0;return o};
function xmsg(t){const m=document.getElementById('xmsg');if(m)m.textContent=t}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}


/* reward alerts (device-only settings) */
let NT={};try{NT=JSON.parse(localStorage.getItem('ba-notify')||'{}')||{}}catch(e){}
const OUT=()=>{try{return JSON.parse(localStorage.getItem('ba-outbox')||'[]')}catch(e){return[]}};
const setOUT=q=>{try{localStorage.setItem('ba-outbox',JSON.stringify(q.slice(-20)))}catch(e){}};
async function sendOne(msg){let ok=false;if(NT.wa&&NT.key){const ph=NT.wa.replace(/[^\d+]/g,'');try{await fetch(`https://api.callmebot.com/whatsapp.php?phone=${encodeURIComponent(ph)}&text=${encodeURIComponent(msg)}&apikey=${encodeURIComponent(NT.key)}`,{mode:'no-cors'});ok=true}catch(e){}}if(NT.topic){try{const r=await fetch('https://ntfy.sh/'+encodeURIComponent(NT.topic.trim()),{method:'POST',body:msg,headers:{Title:'Brain Arcade reward',Tags:'moneybag'}});ok=ok||r.ok}catch(e){}}return ok}
async function flushOut(){const q=OUT();if(!q.length||!(NT.topic||(NT.wa&&NT.key)))return;const left=[];for(const m of q){if(!(await sendOne(m)))left.push(m)}setOUT(left)}
function alertDad(msg){if(!(NT.topic||(NT.wa&&NT.key)))return;const q=OUT();q.push(msg);setOUT(q);flushOut()}
function ntmsg(t){const m=document.getElementById('ntmsg');if(m)m.textContent=t}
setTimeout(flushOut,2000);window.addEventListener('online',flushOut);

/* confetti */
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('canvas'),dp=window.devicePixelRatio||1;c.id='fx';document.body.appendChild(c);const x=c.getContext('2d'),W=c.width=innerWidth*dp,H=c.height=innerHeight*dp,cols=['#ffcf3f','#ff6b5a','#2fa84f','#3d7cf0','#ff8a3d','#ffffff'],P=Array.from({length:150},()=>({x:Math.random()*W,y:-Math.random()*H*.6,vx:(Math.random()-.5)*4*dp,vy:(2+Math.random()*4)*dp,r:(5+Math.random()*7)*dp,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.3}));let t=0;const step=()=>{x.clearRect(0,0,W,H);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.04*dp;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()}if(++t<210)requestAnimationFrame(step);else c.remove()};step()}

/* quit dialog */
function askQuit(){const o=document.createElement('div');o.className='overlay';o.id='ov';o.innerHTML=`<div class="chunk"><h2>Stop this quest?</h2><p class="muted" style="margin:0">Stars from this quest won't be saved.</p><button class="btn wide" data-act="quitNo">Keep playing</button><button class="btn alt wide" data-act="quitYes">Stop</button></div>`;document.body.appendChild(o)}
const closeOv=()=>{const o=document.getElementById('ov');if(o)o.remove()};

/* events */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset;
if(a==='home')home();else if(a==='pick')hub(d.id);else if(a==='go')pickDiff(d.s);else if(a==='diffGo')go(d.s,null,d.v);else if(a==='paid'){const p=PL(d.id);p.paid=(p.paid||0)+1;dirty=true;grownKeep()}else if(a==='unpaid'){const p=PL(d.id);p.paid=Math.max(0,(p.paid||0)-1);dirty=true;grownKeep()}else if(a==='startRound')question();else if(a==='ans')ans(+d.i,b);else if(a==='next')next();else if(a==='nextRound')intro();
else if(a==='say'){if(R&&R.q)say(R.q.say||strip(R.q.prompt))}
else if(a==='quit'){askQuit()}else if(a==='quitNo')closeOv();else if(a==='quitYes'){closeOv();stopT();if(R){const p=PL(R.who);hub(R.who)}}
else if(a==='sound'){soundOn=!soundOn;try{localStorage.setItem('ba-sound',soundOn?'on':'off')}catch(e){}b.innerHTML=soundOn?IC.snd:IC.mute;beep('ok')}
else if(a==='fun'||a==='diff'){R.fb[a]=a==='fun'?+d.v:d.v;document.querySelectorAll('.'+(a==='fun'?'face':'diff')).forEach(x=>x.classList.toggle('on',x===b));document.getElementById('savebtn').disabled=!(R.fb.fun&&R.fb.diff)}
else if(a==='save')finish(true);else if(a==='skip')finish(false);else if(a==='grown')pinPad();else if(a==='pin')pinKey(d.v);else if(a==='sbTrack'){SB.track=d.v;saveSB();grownKeep()}else if(a==='sbPlay')hub('test');else if(a==='sbProf'){me='test';openProf()}else if(a==='sbGame'){me='test';setMe('test');go(d.s,d.v)}else if(a==='sbReset'){if(b.dataset.armed){SB={track:SB.track,player:mk('Test')};saveSB();grownKeep()}else{b.dataset.armed=1;b.textContent='Tap again to wipe the sandbox'}}else if(a==='setPin'){const v=(document.getElementById('newpin')||{}).value||'';if(/^\d{4}$/.test(v)){S.settings.pin=v;b.textContent='Saving…';save().then(()=>{b.textContent='PIN saved'})}else b.textContent='Use 4 digits';}else if(a==='prof')openProf();else if(a==='hub'){PE=null;hub(me)}else if(['star','col','ptype','pg','delPet','addPet','addCust'].includes(a)||a.startsWith('tog-'))profAct(a,d);else if(a==='saveProf')saveProf(b);
else if(a==='lv'){const p=PL(d.id);p.lvl[d.s]=Math.max(1,Math.min(MX(d.id),p.lvl[d.s]+(+d.d)));if(d.id==='test')saveSB();else dirty=true;grownKeep()}
else if(a==='export'){const t=document.getElementById('xcode');t.value=enc({v:1,at:new Date().toISOString(),players:S.players,settings:S.settings});t.select();xmsg('Code ready. Copy it and paste it to Claude.')}else if(a==='copyX'){const t=document.getElementById('xcode');if(!t.value)return xmsg('Create a code first.');try{navigator.clipboard.writeText(t.value).then(()=>xmsg('Copied!'),()=>{t.select();xmsg('Select the text and copy it.')})}catch(e){t.select();xmsg('Select the text and copy it.')}}else if(a==='importX'){let o;try{o=dec(document.getElementById('xcode').value)}catch(e){return xmsg("That code doesn't look right.")}if(!b.dataset.armed){b.dataset.armed=1;b.textContent='Tap again to replace';return xmsg('This replaces all progress on this device.')}S.players=o.players;S.settings=Object.assign({pin:'2030'},o.settings||{});for(const id of ['lily','lucas'])PL(id).profile=Object.assign({pets:[],sports:[],hobbies:[],colour:'',star:'me'},PL(id).profile||{});save().then(()=>{xmsg('Restored.');setTimeout(grown,800)})}else if(a==='saveNT'||a==='testNT'){const v=id=>(document.getElementById(id)||{}).value||'';NT={wa:v('nwa').trim(),key:v('nkey').trim(),topic:v('ntopic').trim().replace(/[^A-Za-z0-9_-]/g,'')};try{localStorage.setItem('ba-notify',JSON.stringify(NT))}catch(e){}if(a==='saveNT'){ntmsg(NT.wa&&NT.key||NT.topic?'Saved. Tap Send test to check.':'Saved. Alerts are off.');flushOut()}else{if(!(NT.topic||(NT.wa&&NT.key)))return ntmsg('Add a WhatsApp number and key, or a push topic, first.');ntmsg('Sending…');sendOne('Brain Arcade: test message. Reward alerts are working on this iPad.').then(ok=>ntmsg(ok?'Sent. Check your phone (WhatsApp can take up to a minute).':'Could not send. Check the internet connection.'))}}else if(a==='saveLv'){b.disabled=true;b.textContent='Saving…';save().then(()=>{b.textContent='Saved'})}});
home();

}</script></body></html>
